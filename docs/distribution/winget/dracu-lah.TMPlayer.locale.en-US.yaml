ReleaseNotes: |-
  TMPlayer now speaks 21 languages (machine translated for now, corrections welcome on GitHub). Home
  has rows, series get their own page, and search covers all your chats. Optional posters and
  overviews come from TMDB, TVmaze and AniList, and subtitles can be found online through
  OpenSubtitles. The player adds volume boost, a sleep timer, a "still watching?" check, subtitle and
  audio delay, subtitle size and position, and simpler controls. Downloads can be removed after
  watching. On desktop the QR sign in works in release builds, and there is a new About screen.
