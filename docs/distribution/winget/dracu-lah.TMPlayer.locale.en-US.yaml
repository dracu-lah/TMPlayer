ShortDescription: Watch the videos in your Telegram chats while they download. Unofficial, not affiliated with Telegram.
Description: |-
  TMPlayer plays the videos in your own Telegram chats and channels. It starts within seconds while
  the file is still downloading, and seeking re-aims the download instead of waiting for it. Sign in
  with a QR code or your phone number, browse each chat's videos as a poster grid, resume where you
  stopped and go on to the next episode. Embedded subtitles and audio tracks play through the bundled
  mpv. TMPlayer is an unofficial client built on TDLib: it is not made by or affiliated with
  Telegram, and it needs your own Telegram account.
