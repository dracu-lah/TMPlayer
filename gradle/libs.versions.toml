[versions]
# AGP 9 because the current AndroidX generation (core 1.19, Compose 1.12 in BOM 2026.09.00 and on)
# declares minAndroidGradlePluginVersion 9.1.0. AGP 9.4 needs Gradle 9.6 or newer, compiles Kotlin
# itself (no org.jetbrains.kotlin.android plugin) and supports compileSdk 37. Kotlin 2.4.21's own
# table lists AGP up to 9.3.1 and Gradle up to 9.7.0 as fully supported; 9.4.1 on Gradle 9.8.1
# builds and tests cleanly here, and 9.3.x on Gradle 9.7.x is the tested pair to fall back to.
agp = "9.4.1"
# tdl-coroutines 15.0.0 is built against kotlin-stdlib 2.4.10, so the compiler has to be at least 2.4.
# The Kotlin Gradle plugin still comes from here: AGP 9 builds :app with it, and :core, :ui and
# :desktop apply the multiplatform and jvm plugins at this version.
kotlin = "2.4.21"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
tvMaterial = "1.1.0"
lifecycle = "2.11.0"
coroutines = "1.11.0"
tdl = "15.0.0"
zxing = "3.5.4"
# 1.8.0 was the release that began surfacing transient AudioTrack underruns as visible
# freeze-then-resume buffering; 1.9.1 added the 100 ms grace period that debounces them, which is
# the fix for the momentary stall Dolby Digital 5.1 tracks showed. nextlib is published as
# <media3 version>-<nextlib version> and its FFmpeg renderers are built against that exact media3,
# so the two move together, to a pair that exists on Maven Central. 1.11.1-0.16.0 brings FFmpeg 9
# and adds VP8, VP9 and AV1 (dav1d) software decoders, which is why its natives are larger.
media3 = "1.11.1"
nextlib = "1.11.1-0.16.0"
leanback = "1.0.0"
fragment = "1.9.1"
datastore = "1.2.1"
# Crash reporting, and only when the viewer switches it on. Core alone: the "sentry-android"
# umbrella pulls in NDK, fragment, Compose and Room integrations, none of which this needs.
sentry = "8.61.0"
# Only for the R8 mapping: a UUID in the APK and the mapping uploaded under it, so a report's
# stack trace reads as the source does. Every other feature of the plugin is off (app/build.gradle.kts).
sentryGradle = "6.24.0"
junit = "4.13.2"
# Draws the TV player's Compose overlays on the JVM, so a screen that cannot compose fails CI.
robolectric = "4.17"
androidxTestCore = "1.7.0"
# Android ships org.json in the platform; a plain JVM does not, so `:core`'s jvm target carries
# this for update-response parsing (and its tests), and the Android build never bundles it.
json = "20240303"
# java.time, java.nio.file and the java.util additions on Android 6 and 7 (API 23 to 25), where the
# platform does not have them yet. The _nio flavour, because the shared core moves and opens files
# through java.nio.file (File.toPath(), Files.move, FileChannel.open) and the plain one stops at
# java.time.
desugarJdkLibs = "2.1.5"
# Desktop (Part B of the 2026-10-03 plan). Compose Multiplatform 1.12.2 maps to Jetpack Compose
# 1.12; mediamp 0.5.2 is built against 1.12 and wraps libmpv. Its native runtime is a separate
# artifact per OS and does not come in transitively, so :desktop names the ones it ships.
composeMultiplatform = "1.12.2"
mediamp = "0.5.2"
appdirs = "1.4.0"
# Material3 for Compose Multiplatform 1.12 (maps to Jetpack Material3 1.5 alphas); icons stay on
# the last published core set, the same handful :app uses.
cmpMaterial3 = "1.12.0-alpha03"
# Desktop OS services (com.tmplayer.desktop.os). dbus-java carries MPRIS and the Linux sleep
# inhibit; its native unix socket transport needs nothing beyond JDK 16+. JNA is pinned to what
# Compose, mediamp and FileKit already resolve to, so the classpath carries one copy.
dbusJava = "5.2.2"
jna = "5.19.1"
# The native folder picker for Settings > Storage location: IFileOpenDialog on Windows, the
# FileChooser portal on Linux (so it works inside the Flatpak), NSOpenPanel on macOS.
filekit = "0.16.0"
# dbus-java logs through SLF4J; with no provider every start prints a warning. Nothing to log to.
slf4j = "2.0.20"
# Casting to a Chromecast or Google TV from the phone (CP73): Google's Cast framework and the
# MediaRouter it finds receivers with. The regular APK only; an F-Droid build has neither
# (app/build.gradle.kts, fdroidBuild).
# JSON for the shared core's documents. At the version Kotlin 2.4 and Compose 1.12 resolve to.
kotlinxSerialization = "1.11.0"
playServicesCast = "22.3.1"
playServicesAuthApiPhone = "18.1.0"
mediarouter = "1.8.1"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core = { group = "androidx.test", name = "core", version.ref = "androidxTestCore" }
json = { group = "org.json", name = "json", version.ref = "json" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs_nio", version.ref = "desugarJdkLibs" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
# For `:core`, whose models carry @Immutable and are compiled by the Compose compiler so that
# :app's screens see them as stable exactly as they did when the classes lived in :app.
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
# @Immutable and @Stable alone, multiplatform, for the pure half of `:core` that the browser build
# compiles too (the js target).
androidx-compose-runtime-annotation = { group = "androidx.compose.runtime", name = "runtime-annotation" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
# Icons only. The "extended" set is thousands of vectors; core carries the handful used here.
# The touch half of the app. tv-material's components are driven by focus and ignore a tap
# outright, so a phone needs the ordinary Material 3 components behind the same screens.
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
# Multiplatform (android and desktop jvm), for the view models `:ui` shares.
androidx-lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose ={ group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
tdl-coroutines = { group = "dev.g000sha256", name = "tdl-coroutines", version.ref = "tdl" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-effect = { group = "androidx.media3", name = "media3-effect", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-leanback = { group = "androidx.leanback", name = "leanback", version.ref = "leanback" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
nextlib-media3ext = { group = "io.github.anilbeesetti", name = "nextlib-media3ext", version.ref = "nextlib" }
# What nextlib-media3ext's POM depends on, for the AAR scripts/build-media3ext.sh builds from source.
androidx-annotation = { group = "androidx.annotation", name = "annotation", version = "1.10.0" }
errorprone-annotations = { group = "com.google.errorprone", name = "error_prone_annotations", version = "2.50.0" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# The multiplatform half of DataStore, which is all `:core` needs: no Context, just a path.
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
sentry-android-core = { group = "io.sentry", name = "sentry-android-core", version.ref = "sentry" }
# The plain JVM SDK that sentry-android-core is built on: the desktop's crash reports, and the
# record, scrubber and daily limits both apps share in :core.
sentry = { group = "io.sentry", name = "sentry", version.ref = "sentry" }

mediamp-api = { group = "org.openani.mediamp", name = "mediamp-api", version.ref = "mediamp" }
mediamp-mpv = { group = "org.openani.mediamp", name = "mediamp-mpv", version.ref = "mediamp" }
mediamp-runtime-linux-x64 = { group = "org.openani.mediamp", name = "mediamp-mpv-runtime-linux-x64", version.ref = "mediamp" }
mediamp-runtime-windows-x64 = { group = "org.openani.mediamp", name = "mediamp-mpv-runtime-windows-x64", version.ref = "mediamp" }
mediamp-runtime-macos-arm64 = { group = "org.openani.mediamp", name = "mediamp-mpv-runtime-macos-arm64", version.ref = "mediamp" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
cmp-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "cmpMaterial3" }
# `:ui`'s jvm target compiles against these. Its android target takes the androidx artifacts from
# the BOM instead, so that adding `:ui` does not move the Android app's Compose versions.
cmp-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "composeMultiplatform" }
cmp-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "composeMultiplatform" }
cmp-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "composeMultiplatform" }
# The desktop render tests' ComposeUiTest, named directly now that the plugin's compose.desktop.uiTestJUnit4 shorthand is deprecated.
cmp-ui-test-junit4 = { group = "org.jetbrains.compose.ui", name = "ui-test-junit4", version.ref = "composeMultiplatform" }
appdirs = { group = "net.harawata", name = "appdirs", version.ref = "appdirs" }
dbus-java-core = { group = "com.github.hypfvieh", name = "dbus-java-core", version.ref = "dbusJava" }
dbus-java-transport-native-unixsocket = { group = "com.github.hypfvieh", name = "dbus-java-transport-native-unixsocket", version.ref = "dbusJava" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
jna-platform = { group = "net.java.dev.jna", name = "jna-platform", version.ref = "jna" }
filekit-dialogs-compose = { group = "io.github.vinceglb", name = "filekit-dialogs-compose", version.ref = "filekit" }
slf4j-nop = { group = "org.slf4j", name = "slf4j-nop", version.ref = "slf4j" }
play-services-cast-framework = { group = "com.google.android.gms", name = "play-services-cast-framework", version.ref = "playServicesCast" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
play-services-auth-api-phone = { group = "com.google.android.gms", name = "play-services-auth-api-phone", version.ref = "playServicesAuthApiPhone" }
androidx-mediarouter = { group = "androidx.mediarouter", name = "mediarouter", version.ref = "mediarouter" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# AGP's own plugin for the Android target of a Kotlin Multiplatform library, used by `:core` and
# `:ui` (configured in `kotlin { android { } }`). AGP 9 no longer lets com.android.library sit
# beside the multiplatform plugin. It has one variant and no Android resources or host tests here.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
sentry-android = { id = "io.sentry.android.gradle", version.ref = "sentryGradle" }
