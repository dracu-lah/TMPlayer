[versions]
agp = "8.13.2"
# tdl-coroutines 15.0.0 is built against kotlin-stdlib 2.4.10, so the compiler has to be at least 2.4
kotlin = "2.4.20"
coreKtx = "1.18.0"
activityCompose = "1.12.0"
composeBom = "2026.06.01"
tvMaterial = "1.1.0"
lifecycle = "2.10.0"
coroutines = "1.11.0"
tdl = "15.0.0"
zxing = "3.5.3"
# 1.8.0 was the release that began surfacing transient AudioTrack underruns as visible
# freeze-then-resume buffering; 1.9.1 added the 100 ms grace period that debounces them, which is
# the fix for the momentary stall Dolby Digital 5.1 tracks showed. 1.10.1 is as far as nextlib's
# FFmpeg renderers currently go, so that is the ceiling.
media3 = "1.10.1"
nextlib = "1.10.1-0.13.0"
leanback = "1.0.0"
fragment = "1.8.9"
datastore = "1.2.1"
# Crash reporting, and only when the viewer switches it on. Core alone: the "sentry-android"
# umbrella pulls in NDK, fragment, Compose and Room integrations, none of which this needs.
sentry = "8.16.0"
junit = "4.13.2"
# Android ships org.json in the platform; a plain JVM does not, so `:core`'s jvm target carries
# this for update-response parsing (and its tests), and the Android build never bundles it.
json = "20240303"
# Desktop (Part B of the 2026-10-03 plan). Compose Multiplatform 1.12.1 maps to Jetpack Compose
# 1.12; mediamp 0.5.0 is built against 1.12.0 and wraps libmpv. Its native runtime is a separate
# artifact per OS and does not come in transitively, so :desktop names the ones it ships.
composeMultiplatform = "1.12.1"
mediamp = "0.5.0"
appdirs = "1.4.0"
# Material3 for Compose Multiplatform 1.12 (maps to Jetpack Material3 1.5 alphas); icons stay on
# the last published core set, the same handful :app uses.
cmpMaterial3 = "1.12.0-alpha03"
cmpMaterialIcons = "1.7.3"

[libraries]
junit = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
# For `:core`, whose models carry @Immutable and are compiled by the Compose compiler so that
# :app's screens see them as stable exactly as they did when the classes lived in :app.
androidx-compose-runtime = { group = "androidx.compose.runtime", name = "runtime" }
androidx-compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
# Icons only. The "extended" set is thousands of vectors; core carries the handful used here.
androidx-compose-material-icons = { group = "androidx.compose.material", name = "material-icons-core" }
# The touch half of the app. tv-material's components are driven by focus and ignore a tap
# outright, so a phone needs the ordinary Material 3 components behind the same screens.
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-tv-material = { group = "androidx.tv", name = "tv-material", version.ref = "tvMaterial" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
tdl-coroutines = { group = "dev.g000sha256", name = "tdl-coroutines", version.ref = "tdl" }
zxing-core = { group = "com.google.zxing", name = "core", version.ref = "zxing" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
androidx-media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
androidx-leanback = { group = "androidx.leanback", name = "leanback", version.ref = "leanback" }
androidx-fragment-ktx = { group = "androidx.fragment", name = "fragment-ktx", version.ref = "fragment" }
nextlib-media3ext = { group = "io.github.anilbeesetti", name = "nextlib-media3ext", version.ref = "nextlib" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
# The multiplatform half of DataStore, which is all `:core` needs: no Context, just a path.
androidx-datastore-preferences-core = { group = "androidx.datastore", name = "datastore-preferences-core", version.ref = "datastore" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
sentry-android-core = { group = "io.sentry", name = "sentry-android-core", version.ref = "sentry" }

mediamp-api = { group = "org.openani.mediamp", name = "mediamp-api", version.ref = "mediamp" }
mediamp-mpv = { group = "org.openani.mediamp", name = "mediamp-mpv", version.ref = "mediamp" }
mediamp-runtime-linux-x64 = { group = "org.openani.mediamp", name = "mediamp-mpv-runtime-linux-x64", version.ref = "mediamp" }
mediamp-runtime-windows-x64 = { group = "org.openani.mediamp", name = "mediamp-mpv-runtime-windows-x64", version.ref = "mediamp" }
mediamp-runtime-macos-arm64 = { group = "org.openani.mediamp", name = "mediamp-mpv-runtime-macos-arm64", version.ref = "mediamp" }
mediamp-runtime-macos-x64 = { group = "org.openani.mediamp", name = "mediamp-mpv-runtime-macos-x64", version.ref = "mediamp" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "coroutines" }
cmp-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "cmpMaterial3" }
cmp-material-icons = { group = "org.jetbrains.compose.material", name = "material-icons-core", version.ref = "cmpMaterialIcons" }
appdirs = { group = "net.harawata", name = "appdirs", version.ref = "appdirs" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
# AGP's own plugin for the Android target of a Kotlin Multiplatform library, used by `:core`.
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
