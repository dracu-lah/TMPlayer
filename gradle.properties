org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# tdl-coroutines needs compileSdk 37, which AGP 8.13 builds fine but was only tested up to 36.1.
# AGP 9 is the real fix and a larger move (see docs/BUILDING.md), so the warning is acknowledged here.
android.suppressUnsupportedCompileSdk=37.0
