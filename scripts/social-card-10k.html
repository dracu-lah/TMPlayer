<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: Poppins; src: url('../site/public/fonts/poppins-400.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: Poppins; src: url('../site/public/fonts/poppins-500.woff2') format('woff2'); font-weight: 500; }
  @font-face { font-family: Poppins; src: url('../site/public/fonts/poppins-600.woff2') format('woff2'); font-weight: 600; }
  @font-face { font-family: Poppins; src: url('../site/public/fonts/poppins-700.woff2') format('woff2'); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; font-family: Poppins, sans-serif; background: #ffffff; color: #11131a; overflow: hidden; }
  .wrap { position: relative; width: 100%; height: 100%; padding: 56px 64px 112px; display: flex; gap: 40px; align-items: center; }
  .blob { position: absolute; border-radius: 50%; filter: blur(0px); }
  .b1 { width: 420px; height: 420px; background: #eaf0ff; top: -170px; left: -150px; }
  .b2 { width: 360px; height: 360px; background: #fdf3e0; bottom: -180px; left: 180px; }
  .left { position: relative; width: 608px; }
  .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .brand img { width: 52px; height: 52px; border-radius: 14px; }
  .brand span { font-size: 30px; font-weight: 600; letter-spacing: -0.01em; }
  .big { font-size: 88px; line-height: 1; font-weight: 700; letter-spacing: -0.03em; }
  .big em { font-style: normal; color: #1a6dff; }
  .sub { margin-top: 18px; font-size: 25px; font-weight: 500; color: #4a4f5c; line-height: 1.35; }
  .chips { display: flex; gap: 12px; margin-top: 28px; }
  .chip { padding: 10px 20px; border: 1px solid #dfe3ea; border-radius: 999px; font-size: 21px; font-weight: 500; color: #333846; }
  .foot { position: absolute; left: 64px; bottom: 40px; display: flex; align-items: center; gap: 16px; font-size: 23px; font-weight: 600; }
  .foot .site { color: #1a6dff; }
  .foot .dot { width: 5px; height: 5px; border-radius: 50%; background: #c6ccd8; }
  .foot .help { color: #4a4f5c; font-weight: 500; }
  .right { position: relative; flex: 1; display: flex; justify-content: flex-end; }
  .shot { width: 476px; border: 1px solid #e3e7ee; border-radius: 20px; overflow: hidden; background: #000; }
  .shot img { display: block; width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="left">
    <div class="brand">
      <img src="../site/public/icon-512.png" alt="">
      <span>TMPlayer</span>
    </div>
    <div class="big"><em>10,000</em> downloads</div>
    <div class="sub">Your own Telegram videos, on every screen.<br>Free and open source.</div>
    <div class="chips">
      <div class="chip">7 platforms</div>
      <div class="chip">21 languages</div>
      <div class="chip">GPL-3.0</div>
    </div>
  </div>
  <div class="right">
    <div class="shot"><img src="../site/public/screenshots/tv-home-960w.webp" alt=""></div>
  </div>
  <div class="foot"><span class="site">tmplayer.org</span><span class="dot"></span><span class="help">Built by one person, kept free. Support it.</span></div>
</div>
</body>
</html>
