<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TMPlayer: still free, still one person</title>
<style>
  @font-face { font-family: Poppins; src: url('../site/public/fonts/poppins-400.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: Poppins; src: url('../site/public/fonts/poppins-500.woff2') format('woff2'); font-weight: 500; }
  @font-face { font-family: Poppins; src: url('../site/public/fonts/poppins-600.woff2') format('woff2'); font-weight: 600; }
  @font-face { font-family: Poppins; src: url('../site/public/fonts/poppins-700.woff2') format('woff2'); font-weight: 700; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; overflow: hidden; background: #f5f6f8; color: #1a1c20;
    font-family: Poppins, sans-serif; text-align: center; }
  .brand { position: absolute; top: 58px; left: 0; right: 0; display: flex; align-items: center;
    justify-content: center; gap: 18px; }
  .brand img { width: 66px; height: 66px; border-radius: 16px; }
  .brand span { font-size: 38px; font-weight: 600; letter-spacing: -0.01em; }

  .stage { position: absolute; top: 146px; left: 0; width: 1080px; height: 500px; }
  .tv { position: absolute; left: 305px; top: 8px; width: 470px; border: 5px solid #1a1c20;
    border-radius: 6px; background: #000; overflow: hidden; }
  .tv img { display: block; width: 100%; }
  /* The three phones fan out symmetrically around the page's centre line (x = 540), the middle one
     upright and a little larger in front, the outer two tilted away from it behind, all three
     standing on the same baseline (top + height, 1:2.22 screens). */
  .ph { position: absolute; width: 140px; border: 4px solid #1a1c20; border-radius: 22px;
    overflow: hidden; background: #000; transform-origin: 50% 100%; }
  .ph img { display: block; width: 100%; }
  .ph.c { left: 465px; top: 176px; width: 150px; z-index: 3; }
  .ph.l { left: 346px; top: 198px; transform: rotate(-8deg); z-index: 2; }
  .ph.r { left: 594px; top: 198px; transform: rotate(8deg); z-index: 2; }

  h1 { position: absolute; top: 700px; left: 0; right: 0; font-size: 86px; line-height: 1.02;
    font-weight: 700; letter-spacing: -0.045em; }
  h1 span { display: block; color: #6b6f78; }
  .sub { position: absolute; top: 906px; left: 0; right: 0; font-size: 28px; line-height: 1.5;
    color: #6b6f78; }
  .sub b { font-weight: 600; color: #1a1c20; }

  .stats { position: absolute; top: 1026px; left: 90px; right: 90px; display: flex;
    justify-content: space-between; }
  .stat { width: 280px; }
  .stat b { display: block; font-size: 56px; line-height: 1.1; font-weight: 700;
    letter-spacing: -0.03em; }
  .stat span { font-size: 26px; color: #6b6f78; }

  .cta { position: absolute; top: 1140px; left: 84px; right: 84px; height: 112px;
    border-radius: 56px; background: #FFDD00; display: flex; align-items: center;
    justify-content: center; gap: 22px; font-size: 42px; font-weight: 700;
    letter-spacing: -0.01em; color: #0d0c22; }
  .cta img { height: 52px; }
  .note { position: absolute; top: 1274px; left: 0; right: 0; font-size: 22px; color: #6b6f78; }
</style>
</head>
<body>
  <div class="brand"><img src="../site/public/icon-512.png" alt=""><span>TMPlayer</span></div>

  <div class="stage">
    <div class="tv"><img src="../site/public/screenshots/tv-home-light.webp" alt=""></div>
    <div class="ph l"><img src="../site/public/screenshots/phone-chats-light.webp" alt=""></div>
    <div class="ph r"><img src="../site/public/screenshots/phone-grid-light.webp" alt=""></div>
    <div class="ph c"><img src="../site/public/screenshots/phone-show-light.webp" alt=""></div>
  </div>

  <h1>Still free.<span>Still one person.</span></h1>
  <div class="sub">Your Telegram videos on TV, phone and computer.<br>If you love it, <b>a coffee keeps it going.</b></div>

  <div class="stats">
    <div class="stat"><b>27.3K</b><span>downloads</span></div>
    <div class="stat"><b>7</b><span>platforms</span></div>
    <div class="stat"><b>22</b><span>languages</span></div>
  </div>

  <div class="cta"><img src="../site/public/brand/bmc-cup-on-yellow.svg" alt="">buymeacoffee.com/nevil.dev</div>
  <div class="note">Completely optional. It unlocks nothing; TMPlayer stays free for everyone.</div>
</body>
</html>
