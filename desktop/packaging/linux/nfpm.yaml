# The .deb and the .rpm, built by nfpm (https://nfpm.goreleaser.com) from the staged tree that
# package.sh prepares; the paths are relative to its work directory, where it runs nfpm, and it
# exports TM_VERSION. nfpm needs neither dpkg nor rpmbuild, so both come out of one Ubuntu runner
# (or a Fedora laptop) with identical contents.
name: tmplayer
arch: amd64
platform: linux
version: ${TM_VERSION}
version_schema: semver
release: "1"
section: video
priority: optional
maintainer: dracu-lah <noreply@github.com>
vendor: TMPlayer
homepage: https://tmplayer.org
license: GPL-3.0-or-later
description: |-
  Watch the videos in your Telegram chats while they download.
  TMPlayer plays the videos in your own Telegram chats and channels. It starts
  within seconds while the file is still downloading, and seeking re-aims the
  download instead of waiting for it. Unofficial; not affiliated with Telegram.

# The app image as jpackage lays it out, in the same place jpackage's own packages put it.
contents:
  - src: stage/opt/tmplayer
    dst: /opt/tmplayer
    type: tree
  - src: /opt/tmplayer/bin/TMPlayer
    dst: /usr/bin/tmplayer
    type: symlink
  # Files only, not a tree: /usr/share and the icon theme directories belong to the system.
  - src: stage/share/applications/io.github.dracu_lah.TMPlayer.desktop
    dst: /usr/share/applications/io.github.dracu_lah.TMPlayer.desktop
  - src: stage/share/metainfo/io.github.dracu_lah.TMPlayer.metainfo.xml
    dst: /usr/share/metainfo/io.github.dracu_lah.TMPlayer.metainfo.xml
  - src: stage/share/icons/hicolor/**/*
    dst: /usr/share/icons/hicolor
  - src: stage/share/doc/tmplayer/copyright
    dst: /usr/share/doc/tmplayer/copyright
    type: doc

# Everything below the JVM comes from the system: TDLib wants OpenSSL 3 and a C++ runtime from
# GCC 13 or later, and libmpv draws through GL or Vulkan and plays through PulseAudio or ALSA.
# The glibc floor is the one the bundled TDLib and libmpv were linked against (see package.sh).
depends:
  - libc6 (>= 2.38)
  - libstdc++6 (>= 13)
  - libssl3t64 | libssl3
  - zlib1g
  - libasound2t64 | libasound2
  - libpulse0
  - libgl1
  - libegl1
  - libvulkan1
  - libx11-6
  - libxext6
  - libxrender1
  - libxtst6
  - libxi6
  - libfontconfig1

overrides:
  # Fedora and openSUSE name these packages differently, so the rpm asks for the libraries by
  # soname, which both resolve.
  rpm:
    depends:
      - libc.so.6(GLIBC_2.38)(64bit)
      - libstdc++.so.6(GLIBCXX_3.4.32)(64bit)
      - libssl.so.3()(64bit)
      - libcrypto.so.3()(64bit)
      - libz.so.1()(64bit)
      - libasound.so.2()(64bit)
      - libpulse.so.0()(64bit)
      - libGL.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libvulkan.so.1()(64bit)
      - libX11.so.6()(64bit)
      - libXext.so.6()(64bit)
      - libXrender.so.1()(64bit)
      - libXtst.so.6()(64bit)
      - libXi.so.6()(64bit)
      - libfontconfig.so.1()(64bit)

rpm:
  group: Applications/Multimedia
  summary: Watch the videos in your Telegram chats while they download
  compression: zstd

deb:
  # xz rather than zstd: every dpkg still in use reads it.
  compression: xz
