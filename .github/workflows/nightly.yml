name: Nightly

# Pushes to main run no CI (the pre-push hook runs the Linux checks locally, scripts/ci-local.sh).
# This is the check from a clean machine: when main has moved since the last green CI run it starts
# CI, Web player and Apple CI by hand-dispatch on main, so Windows, macOS and a cold Linux build
# are covered once a day instead of once per push. Run it by hand before a release.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    name: Start the checks on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 50

      - name: Has main moved since the last green CI run?
        id: recent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="$(gh run list --workflow ci.yml --branch main --status success --limit 1 --json headSha -q '.[0].headSha' 2>/dev/null || true)"
          if [ "${{ github.event_name }}" = workflow_dispatch ] || [ -z "$last" ] || [ "$last" != "$(git rev-parse HEAD)" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main is the commit the last green CI run tested, nothing to check."
          fi

      - name: Dispatch
        if: steps.recent.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail=0
          for wf in ci.yml webapp.yml apple-ci.yml; do
            gh workflow run "$wf" --ref main || fail=1
          done
          exit $fail
