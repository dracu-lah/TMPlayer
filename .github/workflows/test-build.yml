name: Test build (macOS)

# A DMG that can sign in, for trying a commit on a Mac without a tag or a release. The DMG that
# ci.yml builds has no Telegram credentials (that workflow never touches secrets), so it stops at
# "No Telegram API credentials in this build". This one writes them the way release.yml does.
#
# Started by hand only (Actions, Test build (macOS), Run workflow), and the release environment
# asks the maintainer to approve the run before its secrets are read. Nothing is published: the
# DMG is this run's artifact, attached to a test-macos-* prerelease by hand if it is to be shared.
#
# The version is ahead of the latest release (1.27.0-test.<run>), so the app does not offer to
# "update" to an older release while it is being tried.
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version the build carries, x.y.z-suffix; the run number is appended
        required: true
        default: 1.27.0-test

permissions:
  contents: read

jobs:
  desktop-macos:
    name: Desktop (macOS, with credentials)
    runs-on: macos-26
    environment: release

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write Telegram credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          MSONE_GATEWAY_KEY: ${{ secrets.MSONE_GATEWAY_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          # Optional: without it a detail page shows the provider's own score alone.
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: |
          if [ -z "$TG_API_ID" ]; then
            echo "::error::TG_API_ID is not set, so the test build would not be able to sign in"
            exit 1
          fi
          cat > local.properties <<EOF
          TG_API_ID=$TG_API_ID
          TG_API_HASH=$TG_API_HASH
          OPENSUBTITLES_API_KEY=$OPENSUBTITLES_API_KEY
          MSONE_GATEWAY_KEY=$MSONE_GATEWAY_KEY
          TMDB_API_KEY=$TMDB_API_KEY
          OMDB_API_KEY=$OMDB_API_KEY
          EOF

      - name: Package and self-test
        uses: ./.github/actions/desktop-macos
        with:
          version: ${{ inputs.version }}.${{ github.run_number }}

      - name: Shred credentials
        if: always()
        run: rm -f local.properties

      - name: Upload the DMG
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-test-macos
          path: dist/*
          retention-days: 7
          if-no-files-found: error
