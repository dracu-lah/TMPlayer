name: Web player

# The web player in webapp/ (SolidJS, private/WEBAPP-PLAN.md), which is web.tmplayer.org. Every change builds it and runs the end to end tests in Chromium and WebKit
# (the iPhone's engine). Nothing deploys by itself: a deploy is a manual run (Actions, Web player,
# Run workflow) with "deploy" set to preview or production, and it is the user's call. Cloudflare
# Pages keeps every earlier deployment, so the earlier build stays one Rollback away.
on:
  push:
    branches: [main, webapp-solid]
    paths:
      - "webapp/**"
      - "core/**"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/webapp.yml"
  pull_request:
    branches: [main]
    paths:
      - "webapp/**"
      - "core/**"
      - ".github/workflows/webapp.yml"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to Cloudflare Pages after the tests pass"
        type: choice
        options: [none, preview, production]
        default: none

concurrency:
  group: webapp-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The app's rules come from :core's JS target (pnpm rules, ./gradlew :core:webRules).
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # pnpm and Node from webapp/package.json (packageManager, engines).
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: webapp/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: webapp/pnpm-lock.yaml

      - name: Install
        run: pnpm -C webapp install --frozen-lockfile

      - name: The app's rules from :core
        run: pnpm -C webapp rules

      - name: Type check
        run: pnpm -C webapp check

      # The poster proxy (webapp/tmdb) over a mocked TMDB, and its port of the apps' match rules.
      - name: Poster worker tests
        run: pnpm -C webapp test:tmdb

      # The Telegram id and hash end up in the page's script, exactly as they are in the APK, so
      # only a push or a manual run gets them; a pull request stops at the type check (a release
      # build refuses to run without them, vite.config.ts).
      - name: Build
        if: github.event_name != 'pull_request'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          # The web's own gateway key, so it can be revoked apart from the apps'.
          MSONE_GATEWAY_KEY: ${{ secrets.MSONE_GATEWAY_KEY_WEB }}
        run: |
          pnpm -C webapp exec vite build
          test -s webapp/dist/licenses.txt
          # The TV build goes under /tv/ (functions/_middleware.ts answers a TV's page loads with
          # it). The site's own libav files, headers and routes serve both.
          pnpm -C webapp exec vite build --mode tv
          grep -q '^core-js ' webapp/dist-tv/licenses.txt
          rm -rf webapp/dist-tv/libav webapp/dist-tv/_headers webapp/dist-tv/_routes.json
          mv webapp/dist-tv webapp/dist/tv
          webapp/libav/sources.sh webapp/dist/libav/sources
          echo "First load, gzip: $(cat webapp/dist/assets/index-*.js webapp/dist/assets/store-*.js webapp/dist/assets/rolldown-runtime-*.js | gzip -9 | wc -c) bytes of JS" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the rules
        uses: actions/upload-artifact@v7
        with:
          name: webapp-rules
          path: webapp/src/rules/core
          retention-days: 3
          if-no-files-found: error

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: webapp-dist
          path: webapp/dist
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  e2e:
    name: End to end (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    # Playwright's own image has both browsers and what they need; its version matches
    # @playwright/test in webapp/package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        project: [chromium, webkit]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: webapp/package.json

      - name: Install
        run: pnpm -C webapp install --frozen-lockfile

      - name: Download the rules
        uses: actions/download-artifact@v8
        with:
          name: webapp-rules
          path: webapp/src/rules/core

      # The page and worker over a fake Telegram, on the small files in webapp/e2e/media.
      - name: Test
        env:
          HOME: /root
        run: pnpm -C webapp exec playwright test --project=${{ matrix.project }}

      - name: Upload the traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.project }}
          path: webapp/test-results
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: [build, e2e]
    if: github.event_name == 'workflow_dispatch' && inputs.deploy != 'none'
    runs-on: ubuntu-latest
    environment:
      name: web-${{ inputs.deploy }}
      url: ${{ inputs.deploy == 'production' && 'https://web.tmplayer.org' || 'https://solid-preview.tmplayer-webapp.pages.dev' }}

    steps:
      # webapp/functions (the /tmdb poster proxy) ships with the site: wrangler finds it beside
      # the folder it deploys. Its key is the Pages project's secret TMDB_API_KEY, set once with
      # `wrangler pages secret put TMDB_API_KEY --project-name tmplayer-webapp` (never here).
      - uses: actions/checkout@v7
        with:
          # One path per line: on one line they are a single path with a space in it.
          sparse-checkout: |
            webapp/functions
            webapp/tmdb

      - name: Download the site
        uses: actions/download-artifact@v8
        with:
          name: webapp-dist
          path: webapp/dist

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Project tmplayer-webapp: its main branch is web.tmplayer.org, any other branch a preview
      # address of its own.
      - name: Deploy to Cloudflare Pages
        working-directory: webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          ls -la functions/tmdb
          npx --yes wrangler@4.149.0 pages deploy dist \
            --project-name=tmplayer-webapp \
            --branch=${{ inputs.deploy == 'production' && 'main' || 'solid-preview' }} \
            --commit-hash=${{ github.sha }} \
            --commit-message="Web player ${{ github.ref_name }}" | tee "$RUNNER_TEMP/deploy.log"

      # A deploy without the Functions bundle still succeeds, and /tmdb/* then answers the page's
      # index.html: fail here instead. The proxy answers JSON (503 "no key" without the secret).
      - name: The poster proxy and the TV page answer
        run: |
          url=$(grep -oE 'https://[0-9a-f]+\.tmplayer-webapp\.pages\.dev' "$RUNNER_TEMP/deploy.log" | head -1)
          type=$(curl -sS -o /dev/null -w '%{content_type}' "$url/tmdb/poster?k=film&t=Test&y=2020")
          echo "$url/tmdb/poster: $type"
          case "$type" in application/json*) ;; *) echo "::error::/tmdb/ is not the proxy on $url"; exit 1 ;; esac
          # And a TV's browser gets the TV build's page (it loads assets from /tv/).
          curl -sS -H 'Accept: text/html' -A 'Mozilla/5.0 (Web0S; Linux/SmartTV) Chrome/68.0.3440.106' "$url/" | grep -q '/tv/assets/' \
            || { echo "::error::a TV's page load on $url is not the TV build"; exit 1; }
