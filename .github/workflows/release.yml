name: Release

# Releases are cut deliberately, by pushing a tag:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# Nothing else builds a signed APK. That matters because this is the only job that can see the
# signing key, and keeping it off the push-to-main path means an ordinary commit, or a pull
# request from a stranger, can never reach it.
#
# One tag makes one GitHub release with a deliberately short list in it: the universal Android
# APK, the Windows MSI, the Linux AppImage and the Linux tarball (which the AUR PKGBUILD builds
# from), plus the licence material and one checksum file. Each platform builds in its own job; the
# last job gathers them, writes the checksums and publishes. GitHub attaches the source archives
# to every release by itself.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  version:
    name: Derive version from the tag
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - name: Derive version from the tag
        id: version
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          if [[ ! "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          # Android will not install an APK whose versionCode is lower than the installed one,
          # so it is derived arithmetically from the tag and can only ever increase.
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NAME"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $NAME (versionCode $CODE)"

  android:
    name: Android (signed APK)
    needs: version
    runs-on: ubuntu-latest
    # Attach required reviewers to this environment in repo settings to gate access to the key.
    environment: release

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See CONTRIBUTING.md for the setup commands"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Write Telegram credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          # Optional, unlike the two above. Without it the released APK simply has nowhere to send
          # a crash report to, so the Settings switch is never drawn and the feature does not
          # exist in that build. That is a smaller release, not a broken one, so it does not fail.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "$TG_API_ID" ]; then
            echo "::error::TG_API_ID is not set, so the released APK would not be able to sign in"
            exit 1
          fi
          if [ -z "$SENTRY_DSN" ]; then
            echo "::notice::SENTRY_DSN is not set. This build ships without crash reporting."
          fi
          cat > local.properties <<EOF
          TG_API_ID=$TG_API_ID
          TG_API_HASH=$TG_API_HASH
          SENTRY_DSN=$SENTRY_DSN
          EOF

      - name: Run unit tests
        run: ./gradlew :core:jvmTest :app:test

      - name: Build the signed APK
        run: |
          ./gradlew :app:assembleRelease \
            -PtmVersionName=${{ needs.version.outputs.name }} \
            -PtmVersionCode=${{ needs.version.outputs.code }}

      - name: Name the APK after the version
        run: |
          mkdir -p dist mapping
          VERSION="${{ needs.version.outputs.name }}"
          OUT=app/build/outputs/apk/release

          # Only the universal APK is published: it runs on every television, stick and phone the
          # app supports, and it is what the site, the in-app updater and every install guide name.
          # The build still makes the per-ABI splits as a by-product; they are left behind.
          SRC="$OUT/app-universal-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "::error::$SRC was not built. Check the splits block in app/build.gradle.kts"
            exit 1
          fi
          cp "$SRC" "dist/TMPlayer-$VERSION-universal.apk"

          # R8 renames every class, so a crash report from a released APK is unreadable without
          # the mapping for that exact build. It is generated once and then gone, so it is kept
          # as a workflow artifact of this run (below) rather than published with the release:
          # it is for decoding stack traces, not for users. Take it from the run's page.
          cp app/build/outputs/mapping/release/mapping.txt "mapping/mapping-$VERSION.txt"
          ls -la dist mapping

      # Anything holding the signing key is deleted before the job can reach a step that
      # uploads output. Workflow files are cleaned up by the runner anyway; this is belt
      # and braces against a future step accidentally archiving the workspace.
      - name: Shred signing material
        run: rm -f release.keystore keystore.properties local.properties

      - name: Hand the APK to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: dist/*
          retention-days: 3
          if-no-files-found: error

      # Not named release-*, so the publish job does not gather it into the release. Ninety days
      # is the longest a public repository may keep an artifact; download it from the run's page
      # and keep it somewhere safe before then if a stack trace may still need decoding.
      - name: Keep the R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: mapping-${{ needs.version.outputs.name }}
          path: mapping/mapping-${{ needs.version.outputs.name }}.txt
          retention-days: 90
          if-no-files-found: error

  # The AppImage and the tarball, built and self-tested by the same composite action CI runs on
  # every push. Ubuntu 24.04, pinned: the bundled TDLib and libmpv need glibc 2.38 to run the
  # self-test, and the image should not move under a release.
  desktop-linux:
    name: Desktop (Linux)
    needs: version
    runs-on: ubuntu-24.04
    # The Telegram credentials are secrets of this environment.
    environment: release

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write Telegram credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ]; then
            echo "::error::TG_API_ID is not set, so the released app would not be able to sign in"
            exit 1
          fi
          cat > local.properties <<EOF
          TG_API_ID=$TG_API_ID
          TG_API_HASH=$TG_API_HASH
          EOF

      - name: Package and self-test
        uses: ./.github/actions/desktop-linux
        with:
          version: ${{ needs.version.outputs.name }}

      - name: Shred credentials
        if: always()
        run: rm -f local.properties

      - name: Hand the AppImage and tarball to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  desktop-windows:
    name: Desktop (Windows)
    needs: version
    runs-on: windows-latest
    environment: release

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write Telegram credentials
        shell: bash
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ]; then
            echo "::error::TG_API_ID is not set, so the released app would not be able to sign in"
            exit 1
          fi
          printf 'TG_API_ID=%s\nTG_API_HASH=%s\n' "$TG_API_ID" "$TG_API_HASH" > local.properties

      - name: Package and self-test
        uses: ./.github/actions/desktop-windows
        with:
          version: ${{ needs.version.outputs.name }}

      - name: Shred credentials
        if: always()
        shell: bash
        run: rm -f local.properties

      - name: Hand the MSI to the publish job
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: dist/*
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [version, android, desktop-linux, desktop-windows]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Gather every platform's files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Check that nothing is missing
        run: |
          VERSION="${{ needs.version.outputs.name }}"
          # An explicit list, so a job that quietly stops producing a file fails the release
          # instead of publishing a short one. The site and the Android updater match these names.
          for f in \
            "TMPlayer-$VERSION-universal.apk" \
            "TMPlayer-$VERSION-windows-x64.msi" \
            "TMPlayer-$VERSION-x86_64.AppImage" \
            "TMPlayer-$VERSION-linux-x64.tar.gz"; do
            if [ ! -s "dist/$f" ]; then
              echo "::error::dist/$f is missing"
              exit 1
            fi
          done
          # And nothing else: a file the list above does not name would go up unannounced.
          for path in dist/*; do
            case "${path#dist/}" in
              "TMPlayer-$VERSION-universal.apk" | "TMPlayer-$VERSION-windows-x64.msi" | \
                "TMPlayer-$VERSION-x86_64.AppImage" | "TMPlayer-$VERSION-linux-x64.tar.gz") ;;
              *) echo "::error::$path is not one of the release's files"; exit 1 ;;
            esac
          done
          ls -la dist

      # The TMPlayer source itself is the tag's tree and the source archives GitHub attaches to
      # every release. What GitHub cannot attach is the corresponding source of the bundled GPL
      # media extension, so that is built here.
      - name: Package GPL source and notices
        run: |
          VERSION="${{ needs.version.outputs.name }}"
          git clone --depth 1 --branch v1.10.1-0.13.0 \
            https://github.com/anilbeesetti/nextlib.git \
            "nextlib-1.10.1-0.13.0"
          test "$(git -C nextlib-1.10.1-0.13.0 rev-parse HEAD)" = \
            "773c841f86d9775abd0fe18c1fd0f84e00e355c8"
          rm -rf nextlib-1.10.1-0.13.0/.git
          mkdir -p nextlib-1.10.1-0.13.0/upstream-sources
          curl --fail --location --retry 3 \
            https://ffmpeg.org/releases/ffmpeg-6.0.tar.gz \
            --output nextlib-1.10.1-0.13.0/upstream-sources/ffmpeg-6.0.tar.gz
          curl --fail --location --retry 3 \
            https://github.com/webmproject/libvpx/archive/refs/tags/v1.13.0.tar.gz \
            --output nextlib-1.10.1-0.13.0/upstream-sources/libvpx-1.13.0.tar.gz
          curl --fail --location --retry 3 \
            https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v3.4.1.tar.gz \
            --output nextlib-1.10.1-0.13.0/upstream-sources/mbedtls-3.4.1.tar.gz
          sha256sum nextlib-1.10.1-0.13.0/upstream-sources/*.tar.gz \
            > nextlib-1.10.1-0.13.0/upstream-sources/SHA256SUMS
          tar -czf "dist/nextlib-corresponding-source-$VERSION.tar.gz" \
            nextlib-1.10.1-0.13.0

          cp LICENSE "dist/LICENSE-GPL-3.0.txt"
          cp THIRD_PARTY_NOTICES.md "dist/THIRD_PARTY_NOTICES.md"
          test -s "dist/nextlib-corresponding-source-$VERSION.tar.gz"
          test -s "dist/LICENSE-GPL-3.0.txt"
          test -s "dist/THIRD_PARTY_NOTICES.md"

      # Sideloading and installing by hand is a copy-and-paste business and a truncated download
      # looks like a broken app, so publish one file people can check any download against.
      - name: Write the checksums
        run: |
          VERSION="${{ needs.version.outputs.name }}"
          ( cd dist && sha256sum -- * > "../SHA256SUMS-$VERSION.txt" )
          mv "SHA256SUMS-$VERSION.txt" dist/
          cat "dist/SHA256SUMS-$VERSION.txt"

      # The update feed every installed copy reads (C1 of the storage and updates plan). Written
      # here, from the files about to go up, so each package's size and SHA-256 are the published
      # bytes'. It is only committed after the release exists, below, so the feed never points
      # at a download that is not there yet.
      - name: Write the update feed
        run: |
          VERSION="${{ needs.version.outputs.name }}"
          # An annotated tag's message becomes the popup's notes; a plain tag gets the default.
          NOTES=""
          if [ "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME" 2>/dev/null)" = "tag" ]; then
            NOTES="$(git tag -l --format='%(contents:subject) %(contents:body)' "$GITHUB_REF_NAME")"
          fi
          python3 scripts/write-latest-json.py \
            --version "$VERSION" --dist dist --notes "$NOTES" \
            --out "$RUNNER_TEMP/latest.json"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: TMPlayer ${{ needs.version.outputs.name }}
          files: |
            dist/*
          make_latest: "true"
          generate_release_notes: true
          body: |
            ## Downloads

            | Platform | File |
            | --- | --- |
            | Android TV, sticks and phones | `TMPlayer-${{ needs.version.outputs.name }}-universal.apk` |
            | Windows 10 and 11, 64-bit | `TMPlayer-${{ needs.version.outputs.name }}-windows-x64.msi` |
            | Linux, glibc 2.38 or newer (Ubuntu 24.04, Debian 13, Fedora 39 and later) | `TMPlayer-${{ needs.version.outputs.name }}-x86_64.AppImage` |
            | Arch Linux | the PKGBUILD in [`desktop/packaging/aur`](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}/desktop/packaging/aur), built from `TMPlayer-${{ needs.version.outputs.name }}-linux-x64.tar.gz` |

            The deb, rpm, Flatpak and Windows portable zip are no longer built. On Linux take the AppImage, on Windows the MSI.

            ## Install

            **Android.** Sideload the APK with the Downloader app on a TV, or `adb install TMPlayer-${{ needs.version.outputs.name }}-universal.apk`. [INSTALL.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/INSTALL.md) has step by step guides and the remote control keys.

            **Windows.** Run the MSI. It installs for your user only. It is not code signed yet, so SmartScreen warns: click **More info**, then **Run anyway**.

            **Linux.** `chmod +x TMPlayer-${{ needs.version.outputs.name }}-x86_64.AppImage` and run it. If it complains about FUSE, install `libfuse2` or run it with `--appimage-extract-and-run`.

            Installed copies update themselves from inside the app. Check any download against `SHA256SUMS-${{ needs.version.outputs.name }}.txt`.

            ## Licence and source

            GPL-3.0. The source is the [tree for this release](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}) and the source code archives below; `nextlib-corresponding-source-${{ needs.version.outputs.name }}.tar.gz` covers the bundled media extension.

      # tmplayer.org is deployed by Vercel's git integration from main, with no build step and no
      # deploy hook, so a commit to main is the one way the site learns of the release: Vercel
      # picks it up like any other push and the feed is live a minute later. Pushed with this
      # job's token, which starts no other workflow. A tag for an older version (a re-run, a
      # patch to an old line) leaves a newer feed alone.
      - name: Publish the update feed on the site
        run: |
          VERSION="${{ needs.version.outputs.name }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch --depth=1 origin main
            git checkout -B feed FETCH_HEAD
            CURRENT="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' site/latest.json 2>/dev/null || echo 0.0.0)"
            if [ "$(printf '%s\n%s\n' "$CURRENT" "$VERSION" | sort -V | tail -n1)" != "$VERSION" ]; then
              echo "The feed already names $CURRENT, newer than $VERSION; leaving it."
              exit 0
            fi
            cp "$RUNNER_TEMP/latest.json" site/latest.json
            git add site/latest.json
            if git diff --cached --quiet; then
              echo "The feed already names $VERSION."
              exit 0
            fi
            git commit -m "site: the update feed names $VERSION"
            if git push origin HEAD:main; then exit 0; fi
            echo "main moved while the feed was written; trying again."
          done
          echo "::error::Could not push site/latest.json to main"
          exit 1
