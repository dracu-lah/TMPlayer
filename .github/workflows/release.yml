name: Release

# Releases are cut deliberately, by pushing a tag:
#
#     git tag v1.0.0 && git push origin v1.0.0
#
# Nothing else builds a signed APK. That matters because this is the only job that can see the
# signing key, and keeping it off the push-to-main path means an ordinary commit, or a pull
# request from a stranger, can never reach it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-latest
    # Attach required reviewers to this environment in repo settings to gate access to the key.
    environment: release

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Derive version from the tag
        id: version
        run: |
          NAME="${GITHUB_REF_NAME#v}"
          if [[ ! "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          # Android will not install an APK whose versionCode is lower than the installed one,
          # so it is derived arithmetically from the tag and can only ever increase.
          IFS='.' read -r MAJOR MINOR PATCH <<< "$NAME"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $NAME (versionCode $CODE)"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See CONTRIBUTING.md for the setup commands"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
          cat > keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Write Telegram credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          # Optional, unlike the two above. Without it the released APK simply has nowhere to send
          # a crash report to, so the Settings switch is never drawn and the feature does not
          # exist in that build. That is a smaller release, not a broken one, so it does not fail.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "$TG_API_ID" ]; then
            echo "::error::TG_API_ID is not set, so the released APK would not be able to sign in"
            exit 1
          fi
          if [ -z "$SENTRY_DSN" ]; then
            echo "::notice::SENTRY_DSN is not set. This build ships without crash reporting."
          fi
          cat > local.properties <<EOF
          TG_API_ID=$TG_API_ID
          TG_API_HASH=$TG_API_HASH
          SENTRY_DSN=$SENTRY_DSN
          EOF

      - name: Run unit tests
        run: ./gradlew :app:test

      - name: Build signed universal APK
        run: |
          ./gradlew :app:assembleRelease \
            -PtmVersionName=${{ steps.version.outputs.name }} \
            -PtmVersionCode=${{ steps.version.outputs.code }}

      - name: Name the universal APK after the version
        id: rename
        run: |
          mkdir -p dist
          # One APK now: the ABI splits are gone, so Gradle writes app-release.apk rather than
          # the per-ABI set and the universal one beside them. The published name is unchanged,
          # because it is what the site links to and what every install guide tells people to
          # type, and the file still is the universal build: every architecture the app supports.
          cp app/build/outputs/apk/release/app-release.apk \
            "dist/TMPlayer-${{ steps.version.outputs.name }}-universal.apk"
          # R8 renames every class, so a crash report from a released APK is unreadable without
          # the mapping for that exact build. It is generated once and then gone; publish it or
          # the next stack trace from a user is undecodable.
          cp app/build/outputs/mapping/release/mapping.txt \
            "dist/mapping-${{ steps.version.outputs.name }}.txt"
          ls -la dist

      - name: Package GPL source and notices
        run: |
          VERSION="${{ steps.version.outputs.name }}"
          git archive --format=tar.gz --prefix="TMPlayer-$VERSION/" \
            --output="dist/TMPlayer-$VERSION-source.tar.gz" "$GITHUB_SHA"

          git clone --depth 1 --branch 1.8.0-0.9.0 \
            https://github.com/anilbeesetti/nextlib.git \
            "nextlib-1.8.0-0.9.0"
          test "$(git -C nextlib-1.8.0-0.9.0 rev-parse HEAD)" = \
            "1b69e9490c172c42f73f7a6f1b9ffd1c8be4a060"
          rm -rf nextlib-1.8.0-0.9.0/.git
          mkdir -p nextlib-1.8.0-0.9.0/upstream-sources
          curl --fail --location --retry 3 \
            https://ffmpeg.org/releases/ffmpeg-6.0.tar.gz \
            --output nextlib-1.8.0-0.9.0/upstream-sources/ffmpeg-6.0.tar.gz
          curl --fail --location --retry 3 \
            https://github.com/webmproject/libvpx/archive/refs/tags/v1.13.0.tar.gz \
            --output nextlib-1.8.0-0.9.0/upstream-sources/libvpx-1.13.0.tar.gz
          curl --fail --location --retry 3 \
            https://github.com/Mbed-TLS/mbedtls/archive/refs/tags/v3.4.1.tar.gz \
            --output nextlib-1.8.0-0.9.0/upstream-sources/mbedtls-3.4.1.tar.gz
          sha256sum nextlib-1.8.0-0.9.0/upstream-sources/*.tar.gz \
            > nextlib-1.8.0-0.9.0/upstream-sources/SHA256SUMS
          tar -czf "dist/nextlib-corresponding-source-$VERSION.tar.gz" \
            nextlib-1.8.0-0.9.0

          cp LICENSE "dist/LICENSE-GPL-3.0.txt"
          cp THIRD_PARTY_NOTICES.md "dist/THIRD_PARTY_NOTICES.md"
          test -s "dist/TMPlayer-$VERSION-source.tar.gz"
          test -s "dist/nextlib-corresponding-source-$VERSION.tar.gz"
          test -s "dist/LICENSE-GPL-3.0.txt"
          test -s "dist/THIRD_PARTY_NOTICES.md"

      # Anything holding the signing key is deleted before the job can reach a step that
      # publishes output. Workflow files are cleaned up by the runner anyway; this is belt
      # and braces against a future step accidentally archiving the workspace.
      - name: Shred signing material
        run: rm -f release.keystore keystore.properties local.properties

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: TMPlayer ${{ steps.version.outputs.name }}
          files: |
            dist/*
          generate_release_notes: true
          body: |
            ## Install

            Android TV only. The universal APK works on every supported TV architecture, so there
            is no CPU variant to choose.

            ```
            adb install TMPlayer-${{ steps.version.outputs.name }}-universal.apk
            ```

            See [INSTALL.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/INSTALL.md)
            for sideloading steps and the remote-control reference.

            ## Licence and source

            TMPlayer is GPL-3.0. This release includes the exact TMPlayer source, the corresponding
            source and build material for the bundled GPL native media extension, the licence,
            third-party notices, and the R8 mapping for this APK.

            See the immutable [source tree for this release](https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}).
