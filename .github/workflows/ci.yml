name: CI

# Every push and every pull request. This job never touches signing keys or Telegram
# credentials, so it is safe to run on contributions from people you do not know.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # No credentials on this path. The app compiles fine without them and says so at runtime,
      # which is exactly what a fork or a pull request should get.
      - name: Run unit tests
        run: ./gradlew :app:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: tmplayer-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
