name: CI

# Pull requests build without credentials, so contributions from people you do not know cannot
# reach them. Pushes to main and manual runs produce an APK that can sign in to Telegram.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: No em or en dashes
        run: |
          if git ls-files -z | xargs -0 grep -InIP '[\x{2012}-\x{2015}]'; then
            echo "::error::Found an em or en dash. Replace it with ordinary punctuation."
            exit 1
          fi
          echo "Clean: no em or en dashes in tracked files."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Write Telegram credentials for a trusted build
        if: github.event_name != 'pull_request'
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          if [ -z "$TG_API_ID" ] || [ -z "$TG_API_HASH" ]; then
            echo "::error::TG_API_ID and TG_API_HASH must both be repository secrets for a trusted build"
            exit 1
          fi
          printf 'TG_API_ID=%s\nTG_API_HASH=%s\n' "$TG_API_ID" "$TG_API_HASH" > local.properties

      - name: Run unit tests
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew :app:test
          else
            ./gradlew :app:test -PrequireTelegramCredentials=true
          fi

      - name: Build debug APK
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            ./gradlew :app:assembleDebug
          else
            ./gradlew :app:assembleDebug -PrequireTelegramCredentials=true
          fi

      - name: Remove Telegram credentials
        if: always() && github.event_name != 'pull_request'
        run: rm -f local.properties

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
