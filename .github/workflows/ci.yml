name: CI

# Every push and every pull request that touches the build. This job never touches signing keys
# or Telegram credentials, so it is safe to run on contributions from people you do not know.
#
# A change confined to the site, the docs, Markdown or the PKGBUILD cannot break a build, so it
# does not start one: that covers the release job's own "site: the update feed names x.y.z"
# commit and ordinary doc edits. A push that also touches anything else still runs everything,
# and workflow_dispatch runs it by hand whatever changed.
on:
  push:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - "desktop/packaging/aur/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "site/**"
      - "docs/**"
      - "**/*.md"
      - "desktop/packaging/aur/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # House style: no em or en dashes in tracked files. They are awkward to type consistently
      # and they arrive invisibly on copy-paste, so the build rejects them rather than leaving it
      # to review. Use a comma, a colon or two sentences.
      - name: No em or en dashes
        # The codepoints are written as escapes rather than as the characters themselves, so
        # this check does not match its own source and report a false positive.
        run: |
          if git ls-files -z | xargs -0 grep -InIP '[\x{2012}-\x{2015}]'; then
            echo "::error::Found an em or en dash. Replace it with ordinary punctuation."
            exit 1
          fi
          echo "Clean: no em or en dashes in tracked files."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # No credentials on this path. The app compiles fine without them and says so at runtime,
      # which is exactly what a fork or a pull request should get.
      # :core is the shared half (TDLib, settings, downloads, the streaming window) that the
      # desktop app builds on too. Its tests run on a plain JVM, the way the desktop runs it.
      - name: Run core tests
        run: ./gradlew :core:jvmTest

      - name: Run unit tests
        run: ./gradlew :app:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

  # The desktop app, packaged exactly as a release packages it (the same composite actions under
  # .github/actions) and self-tested from every download, so a broken installer shows up on the
  # push that broke it rather than on release day. No credentials: the app builds and loads its
  # natives without them. This is where Windows and macOS are compiled, tested and packaged at
  # all, since the developer has only a Linux machine.
  #
  # Ubuntu 24.04 rather than ubuntu-latest: the bundled TDLib and libmpv need glibc 2.38, so the
  # runner must have at least that to run the self-test, and a pinned image keeps the result the
  # same when "latest" moves.
  desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Package and self-test
        uses: ./.github/actions/desktop-linux
        with:
          version: 1.0.1-ci.${{ github.run_number }}

      - name: Upload Linux packages
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-desktop-linux
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Publish desktop test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results-linux
          path: desktop/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 1.0.0 installed first, then this build's 1.0.1 over it: the upgrade must replace it.
      - name: Package, upgrade and self-test
        uses: ./.github/actions/desktop-windows
        with:
          version: 1.0.1-ci.${{ github.run_number }}
          upgrade-from: 1.0.0

      # SMTC (media keys and the now playing flyout) has never run on a Windows machine the
      # developer can see, so this is where it is checked. The desktop tests above already ran
      # SmtcWindowsSmokeTest, which binds SMTC to a hidden native window, drives a session through
      # update, clear and release, and fails if any of it throws. This step makes sure it really
      # ran (not skipped) and lifts its "smtc: ..." line, live or fell back, into a notice.
      - name: SMTC smoke test result
        shell: pwsh
        run: |
          $xml = "desktop/build/test-results/test/TEST-com.tmplayer.desktop.os.SmtcWindowsSmokeTest.xml"
          if (-not (Test-Path $xml)) { throw "SmtcWindowsSmokeTest did not run" }
          [xml]$doc = Get-Content $xml
          $suite = $doc.testsuite
          if ([int]$suite.skipped -ne 0) { throw "SmtcWindowsSmokeTest was skipped on Windows" }
          if ([int]$suite.failures -ne 0 -or [int]$suite.errors -ne 0) { throw "SmtcWindowsSmokeTest failed" }
          $out = "$($doc.SelectSingleNode('//system-out').InnerText)`n$($doc.SelectSingleNode('//system-err').InnerText)"
          $out -split "`n" | Where-Object { $_ -match 'smtc|Smtc' } | Write-Host
          $line = ($out -split "`n" | Where-Object { $_ -match '^smtc: ' } | Select-Object -First 1)
          if (-not $line) { throw "SmtcWindowsSmokeTest printed no 'smtc:' line" }
          Write-Host "::notice title=SMTC::$($line.Trim())"

      # The fullscreen round trip that left a maximized window under the taskbar. The dev
      # harness plays a generated clip, goes fullscreen and back, and prints where the window
      # landed: the frame, its client area, the monitor's work area, Compose's placement and AWT's
      # extendedState. Maximized must come back maximized with the client area's bottom on the
      # work area's bottom; floating must come back to the same rectangle ten times running. The
      # hosted runner has an interactive desktop; should the harness get no window or the clip
      # never open, the run is killed after a few minutes and the step fails rather than hanging.
      - name: Fullscreen round trip
        shell: pwsh
        timeout-minutes: 15
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress | Out-Null
          }
          $clip = Join-Path $env:RUNNER_TEMP "clip.mkv"
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i "testsrc=size=320x240:rate=25" -t 60 -c:v mpeg4 $clip
          if (-not (Test-Path $clip)) { throw "could not generate the test clip" }
          $settings = Join-Path $env:RUNNER_TEMP "harness-settings"

          function Invoke-Harness([string]$name, [string]$extra) {
            $out = Join-Path $env:RUNNER_TEMP "$name.txt"
            # Forward slashes: Gradle splits --args itself, and a backslash is not worth the doubt.
            $harnessArgs = "--file $($clip -replace '\\', '/') --settings $($settings -replace '\\', '/') --size 800x500 $extra"
            $p = Start-Process cmd.exe -NoNewWindow -PassThru -ArgumentList "/c gradlew.bat --no-daemon -q :desktop:runPlayerDev `"--args=$harnessArgs`" > `"$out`" 2>&1"
            $null = $p.Handle
            if (-not $p.WaitForExit(300000)) {
              taskkill /T /F /PID $p.Id | Out-Null
              if (Test-Path $out) { Get-Content $out }
              throw "${name}: the dev harness did not finish within 5 minutes (no window on the runner, or the clip never opened)"
            }
            $lines = @(Get-Content $out)
            $lines | Write-Host
            if ($p.ExitCode -ne 0) { throw "${name}: the dev harness exited with $($p.ExitCode)" }
            return $lines
          }

          $pattern = 'bounds=(-?\d+),(-?\d+),(\d+)x(\d+) client=(-?\d+),(-?\d+),(\d+)x(\d+) work=(-?\d+),(-?\d+),(\d+)x(\d+) placement=(\w+) extendedState=(\d+)'
          function Read-Geometry([string]$name, [string[]]$lines, [string]$label) {
            $found = @($lines | Where-Object { $_ -like "dev: $label *" } | ForEach-Object {
              if ($_ -notmatch $pattern) { throw "${name}: cannot read '$_'" }
              [pscustomobject]@{
                Bounds = "$($Matches[1]),$($Matches[2]),$($Matches[3])x$($Matches[4])"
                ClientBottom = [int]$Matches[6] + [int]$Matches[8]
                WorkBottom = [int]$Matches[10] + [int]$Matches[12]
                Placement = $Matches[13]
                State = [int]$Matches[14]
              }
            })
            if ($found.Count -eq 0) { throw "${name}: the harness printed no 'dev: $label' line" }
            return $found
          }

          # Maximized: one round trip.
          $lines = Invoke-Harness "maximized" "--maximized --fullscreen-after 1500 --quit-after 6000"
          foreach ($g in @(@(Read-Geometry "maximized" $lines "start")[0], @(Read-Geometry "maximized" $lines "back")[-1])) {
            if ($g.Placement -ne "Maximized" -or ($g.State -band 6) -ne 6) {
              throw "maximized: expected a maximized window, got placement $($g.Placement), extendedState $($g.State)"
            }
            if ([math]::Abs($g.ClientBottom - $g.WorkBottom) -gt 1) {
              throw "maximized: the window's bottom is at $($g.ClientBottom), the work area's at $($g.WorkBottom)"
            }
          }

          # Floating: ten round trips, no drift.
          $lines = Invoke-Harness "floating" "--fullscreen-after 1500 --fullscreen-rounds 10 --quit-after 24000"
          $start = @(Read-Geometry "floating" $lines "start")[0]
          $backs = @(Read-Geometry "floating" $lines "back")
          if ($backs.Count -ne 10) { throw "floating: expected 10 round trips, saw $($backs.Count)" }
          foreach ($g in $backs) {
            if ($g.Placement -ne "Floating" -or $g.State -ne 0 -or $g.Bounds -ne $start.Bounds) {
              throw "floating: started at $($start.Bounds), came back at $($g.Bounds), placement $($g.Placement), extendedState $($g.State)"
            }
          }
          Write-Host "Fullscreen round trip: maximized and floating both come back where they were."

      - name: Upload Windows packages
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-desktop-windows
          path: dist/*
          retention-days: 14
          if-no-files-found: error

      - name: Publish desktop test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results-windows
          path: desktop/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

  # macOS is not released (it would ship unsigned, which macOS 15 and later refuse to open without
  # a trip to Privacy and Security), but it keeps compiling, testing and packaging here.
  desktop-macos:
    name: Desktop (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run desktop tests
        run: ./gradlew :desktop:test

      - name: Package the DMG and the app
        run: ./gradlew :desktop:packageDmg :desktop:createDistributable

      - name: Self-test the app
        run: desktop/build/compose/binaries/main/app/TMPlayer.app/Contents/MacOS/TMPlayer --self-test

      - name: Upload the DMG
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-desktop-macos
          path: desktop/build/compose/binaries/main/dmg/*.dmg
          retention-days: 14
          if-no-files-found: error

      - name: Publish desktop test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results-macos
          path: desktop/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
