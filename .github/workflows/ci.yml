name: CI

# Every push and every pull request. This job never touches signing keys or Telegram
# credentials, so it is safe to run on contributions from people you do not know.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # House style: no em or en dashes in tracked files. They are awkward to type consistently
      # and they arrive invisibly on copy-paste, so the build rejects them rather than leaving it
      # to review. Use a comma, a colon or two sentences.
      - name: No em or en dashes
        # The codepoints are written as escapes rather than as the characters themselves, so
        # this check does not match its own source and report a false positive.
        run: |
          if git ls-files -z | xargs -0 grep -InIP '[\x{2012}-\x{2015}]'; then
            echo "::error::Found an em or en dash. Replace it with ordinary punctuation."
            exit 1
          fi
          echo "Clean: no em or en dashes in tracked files."

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # No credentials on this path. The app compiles fine without them and says so at runtime,
      # which is exactly what a fork or a pull request should get.
      # :core is the shared half (TDLib, settings, downloads, the streaming window) that the
      # desktop app builds on too. Its tests run on a plain JVM, the way the desktop runs it.
      - name: Run core tests
        run: ./gradlew :core:jvmTest

      - name: Run unit tests
        run: ./gradlew :app:test

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore

  # The desktop app on the OS it is packaged for: the Compose plugin builds installers only on the
  # matching host. Unsigned; signing and the release installers come with Conveyor (Phase 2).
  # This is where Windows and macOS are compiled, tested and packaged at all, since the developer
  # has only a Linux machine.
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: packageDeb createDistributable
          - os: windows-latest
            package: packageMsi
          - os: macos-latest
            package: packageDmg

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run desktop tests
        run: ./gradlew :desktop:test

      - name: Package
        shell: bash
        run: |
          tasks=""
          for t in ${{ matrix.package }}; do tasks="$tasks :desktop:$t"; done
          ./gradlew $tasks

      - name: Tarball the Linux app image
        if: runner.os == 'Linux'
        run: tar -C desktop/build/compose/binaries/main/app -czf desktop/build/compose/binaries/main/TMPlayer-linux-x64.tar.gz TMPlayer

      - name: Upload desktop packages
        uses: actions/upload-artifact@v7
        with:
          name: tmplayer-desktop-${{ runner.os }}
          path: |
            desktop/build/compose/binaries/main/deb/*.deb
            desktop/build/compose/binaries/main/*.tar.gz
            desktop/build/compose/binaries/main/msi/*.msi
            desktop/build/compose/binaries/main/dmg/*.dmg
          retention-days: 14
          if-no-files-found: error

      - name: Publish desktop test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results-${{ runner.os }}
          path: desktop/build/reports/tests/
          retention-days: 14
          if-no-files-found: ignore
