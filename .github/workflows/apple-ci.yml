name: Apple CI

# Checks for the iOS and iPadOS app (docs/IOS.md) on every pull request and push to main that
# touches what it is built from. Like ci.yml it never sees a secret: Telegram's api id and hash are
# dummies, so an unknown contributor's pull request is safe to run.
#
# Two jobs:
# - linux: the release scripts' tests, the AltStore source (script check and JSON schema), the dash
#   rule on the iOS files and the Kotlin half compiled for iOS (Kotlin/Native cross-compiles klibs
#   on Linux; nothing links). Free on a public repository, so it always runs.
# - macos: xcodegen, the Xcode build for the simulator and the Swift unit tests. It runs only when
#   the repository variable APPLE_MAC_CI is 'true', so a fork without macOS minutes is not charged;
#   APPLE_CI_RUNNER names another runner label (macos-26 when unset), APPLE_CI_KOTLIN_HEAP the
#   Kotlin compiler's heap (3g when unset).
#
# The path filter is wider than the iosMain folders on purpose: the app's phone screens, the player
# and the shared code are compiled for iOS from copies (docs/IOS.md, "How the port is built"), so a
# change in app/src/main/java or in core and ui can break only the iOS build.
on:
  pull_request:
    branches: [main]
    paths:
      - "ios/**"
      - "iosApp/**"
      - "altstore/**"
      - "gradle/**"
      - "core/src/**"
      - "ui/src/**"
      - "app/src/main/java/**"
      - "app/src/main/res/**"
      - "scripts/ios-setup.sh"
      - "settings.gradle.kts"
      - ".github/workflows/apple-ci.yml"
  workflow_dispatch:
    inputs:
      accessibility_audit:
        description: "Also run the accessibility audit (AccessibilityAuditTests, the sign in screen: no account on the runner)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: apple-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (scripts, source, Kotlin for iOS)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v7

      - name: Release scripts, AltStore source and identifiers
        run: |
          # jsonschema only for the schema check; the release scripts themselves use the standard
          # library. A virtual environment, since the runner's Python is managed by the system.
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet "jsonschema==4.23.0"
          PY="$RUNNER_TEMP/venv/bin/python"
          "$PY" -I -m unittest discover -s iosApp/release
          "$PY" -I iosApp/release/altstore_source.py check --project iosApp/project.yml
          "$PY" -I iosApp/release/validate_schema.py altstore/source.json altstore/source.schema.json
          sh -n scripts/ios-setup.sh
          bash -n iosApp/release/build-ipa.sh

      - name: No em or en dashes in the iOS files
        run: |
          # The Style workflow checks every tracked file; this names the ones this workflow owns.
          if grep -rInP '[\x{2012}-\x{2015}]' ios iosApp altstore docs/IOS.md scripts/ios-setup.sh .github/workflows/apple-ci.yml .github/workflows/apple-release.yml; then
            echo "::error::Found an em or en dash. Replace it with ordinary punctuation."
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # The Kotlin/Native toolchain and its dependencies, about 800 MB, downloaded on the first
      # run; keyed on the Kotlin version, which decides which toolchain it is.
      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-linux-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-linux-

      - name: Dummy credentials
        run: |
          # The app builds without Telegram's real api id and hash and says so at runtime. The
          # hash must look like one (32 hex digits) or the build leaves it empty.
          {
            echo "TG_API_ID=1"
            echo "TG_API_HASH=$(printf '0%.0s' $(seq 32))"
          } > local.properties

      - name: Kotlin for iOS
        run: |
          # The iOS copies of the shared and Android sources (the variant's replacements apply), then
          # the three klibs compiled for a device. Nothing links: that needs a Mac.
          ./gradlew -Ptmplayer.ios=true --max-workers=3 \
            :core:appleSourcesForIos :ui:appleSourcesForIos :ios:androidScreensForIos :ios:androidPlayerForIos \
            :core:compileKotlinIosArm64 :ui:compileKotlinIosArm64 :ios:compileKotlinIosArm64

  macos:
    name: macOS (Xcode build and Swift tests)
    # Off unless the repository variable APPLE_MAC_CI is 'true': macOS minutes cost money on a private
    # repository or a fork.
    if: vars.APPLE_MAC_CI == 'true'
    runs-on: ${{ vars.APPLE_CI_RUNNER || 'macos-26' }}
    timeout-minutes: 120
    env:
      # Xcode's own script phase runs Gradle with these. The Kotlin compiler's heap for the Debug
      # framework is 3g unless APPLE_CI_KOTLIN_HEAP says otherwise (the Release link needs 6000m,
      # iosApp/release/build-ipa.sh; a Debug build much less).
      GRADLE_OPTS: >-
        -Dorg.gradle.jvmargs=-Xmx2g
        -Dfile.encoding=UTF-8
        -Dorg.gradle.project.kotlin.native.jvmArgs=-Xmx${{ vars.APPLE_CI_KOTLIN_HEAP || '3g' }}
        -Dorg.gradle.project.kotlin.native.disableCompilerDaemon=true
        -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-macos-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-macos-

      # MPVKit's binary frameworks, resolved from Package.resolved's pin.
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ~/spm
          key: spm-${{ hashFiles('iosApp/TMPlayer.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Dummy credentials
        run: |
          {
            echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
            echo "TG_API_ID=1"
            echo "TG_API_HASH=$(printf '0%.0s' $(seq 32))"
          } > local.properties

      # project.yml is the source of the Xcode project (docs/IOS.md). XcodeGen's output is compared
      # with the committed project and a difference is a warning, not a failure: the project has
      # been edited by hand for the identifiers (docs/IOS.md, Known issues).
      - name: XcodeGen
        run: |
          brew install xcodegen
          (cd iosApp && xcodegen generate)
          if ! git diff --quiet -- iosApp/TMPlayer.xcodeproj; then
            echo "::warning::iosApp/TMPlayer.xcodeproj differs from what xcodegen makes from project.yml: run xcodegen generate and commit it"
            git diff --stat -- iosApp/TMPlayer.xcodeproj
          fi

      - name: Pick a simulator
        run: |
          # The newest iPhone this Xcode has a runtime for, by its identifier, so the job does not
          # depend on a device name (iPhone 17) staying in the runner image.
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          found = []
          for runtime, devices in json.load(sys.stdin)["devices"].items():
              if "iOS" in runtime:
                  found += [(runtime, d["name"], d["udid"]) for d in devices if d["name"].startswith("iPhone")]
          print(sorted(found)[-1][2] if found else "")
          ')
          if [ -z "$udid" ]; then echo "::error::No iPhone simulator on this runner"; exit 1; fi
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild build -project iosApp/TMPlayer.xcodeproj -scheme TMPlayer \
            -destination "id=$SIMULATOR" -configuration Debug \
            -derivedDataPath "$RUNNER_TEMP/derived" -clonedSourcePackagesDirPath "$HOME/spm" \
            CODE_SIGNING_ALLOWED=NO -quiet

      - name: Swift unit tests
        run: |
          set -o pipefail
          xcodebuild test -project iosApp/TMPlayer.xcodeproj -scheme TMPlayer \
            -destination "id=$SIMULATOR" -configuration Debug -only-testing:TMPlayerTests \
            -derivedDataPath "$RUNNER_TEMP/derived" -clonedSourcePackagesDirPath "$HOME/spm" \
            -resultBundlePath "$RUNNER_TEMP/unit.xcresult" CODE_SIGNING_ALLOWED=NO -quiet

      # By hand only (workflow_dispatch with accessibility_audit): iOS's own audit of the first screen,
      # which on a runner with no account is the sign in. The screens after it need a signed in device
      # (iosApp/TMPlayerUITests/AccessibilityAuditTests.swift, docs/IOS.md).
      - name: Accessibility audit
        if: github.event_name == 'workflow_dispatch' && inputs.accessibility_audit
        run: |
          set -o pipefail
          xcodebuild test -project iosApp/TMPlayer.xcodeproj -scheme TMPlayerDeviceCheck \
            -destination "id=$SIMULATOR" -configuration Debug \
            -only-testing:TMPlayerUITests/AccessibilityAuditTests/testFirstScreen \
            -derivedDataPath "$RUNNER_TEMP/derived" -clonedSourcePackagesDirPath "$HOME/spm" \
            -resultBundlePath "$RUNNER_TEMP/audit.xcresult" CODE_SIGNING_ALLOWED=NO -quiet

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: apple-ci-unit-xcresult
          path: |
            ${{ runner.temp }}/unit.xcresult
            ${{ runner.temp }}/audit.xcresult
          retention-days: 7
          if-no-files-found: ignore
