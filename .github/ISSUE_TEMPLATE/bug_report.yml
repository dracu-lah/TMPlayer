name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please check that the problem still happens on the latest version first.
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android TV or Google TV
        - Fire TV
        - Android phone or tablet
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in Settings, under About.
      placeholder: "1.22.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device or computer
      description: For example "Mi TV Stick", "POCO X5", "Windows 11", or the Linux distribution and which file you installed (AppImage, tarball or AUR).
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: The video, if it is a playback problem
      description: Container and codecs from VLC's or mpv's media info, and the file size.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`adb logcat` on Android, or the output of starting the desktop app from a terminal."
      render: text
