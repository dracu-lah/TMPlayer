name: Desktop Linux packages
description: >
  Tests the desktop app, builds the Linux tarball and AppImage into dist/, and runs the packaged
  app's --self-test from each of them, so that no package whose natives fail to load can leave CI. Shared by ci.yml and release.yml; the caller checks out,
  sets up JDK 21 and Gradle, and writes local.properties if the build should carry credentials.

inputs:
  version:
    description: The version to build, x.y.z or x.y.z-suffix
    required: true

runs:
  using: composite
  steps:
    # The libraries the bundled TDLib, libmpv and JVM load from the system (the same list the
    # PKGBUILD declares), plus the tools for validating the desktop entry and AppStream metadata.
    - name: Install packaging tools and runtime libraries
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends \
          desktop-file-utils appstream \
          libvulkan1 libpulse0 libasound2t64 libegl1 libgl1 libxtst6 libxi6 libfontconfig1

    - name: Run desktop tests
      shell: bash
      run: ./gradlew :desktop:test

    - name: Build the app image
      shell: bash
      run: ./gradlew :desktop:createDistributable -PdesktopVersion=${{ inputs.version }}

    - name: Self-test the app image
      shell: bash
      run: desktop/build/compose/binaries/main/app/TMPlayer/bin/TMPlayer --self-test

    # Raises the alarm if a dependency bump ships a native that needs a newer glibc than the
    # downloads promise (2.38, from the TDLib and libmpv builds).
    - name: Check the glibc floor
      shell: bash
      run: desktop/packaging/linux/glibc-floor.sh desktop/build/compose/binaries/main/app/TMPlayer

    - name: Fetch appimagetool
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/tools"
        cd "$RUNNER_TEMP/tools"
        curl -sSfL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
        sha256sum -c <<'EOF'
        ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  appimagetool
        EOF
        chmod +x appimagetool
        echo "APPIMAGETOOL=$RUNNER_TEMP/tools/appimagetool" >> "$GITHUB_ENV"

    - name: Build the tarball and AppImage
      shell: bash
      run: OUT="$PWD/dist" desktop/packaging/linux/package.sh "${{ inputs.version }}"

    - name: Self-test the tarball
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/tar"
        tar -C "$RUNNER_TEMP/tar" -xzf "dist/TMPlayer-${{ inputs.version }}-linux-x64.tar.gz"
        "$RUNNER_TEMP/tar/TMPlayer-${{ inputs.version }}/bin/TMPlayer" --self-test

    - name: Self-test the AppImage
      shell: bash
      run: |
        # No FUSE on the runner: the AppImage unpacks itself and runs from there instead.
        APPIMAGE_EXTRACT_AND_RUN=1 "dist/TMPlayer-${{ inputs.version }}-x86_64.AppImage" --self-test

    - name: List the packages
      shell: bash
      run: ls -la dist
